name: C++ cross-platform build and real-socket tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure C++17
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Socket, sequence and timestamp integration tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Offline Python orchestrator and analysis tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker-smoke:
    name: Alpine runtime C++ smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build final Alpine image and run unprivileged C++ selftest
        run: docker compose build --no-cache
      - name: Run container executable explicitly
        run: docker compose run --rm bench selftest
